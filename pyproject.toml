[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-agent"
version = "0.1.0rc2"
description = "QuantLab v0.1.0-preview.2 — cryptocurrency quantitative research and simulation platform (AI Agent layer)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "cryptography>=42",
    "packaging>=24",  # 工作流依赖版本约束检查
    "numpy>=1.26",  # 因子研究：面板计算与评估
    "Pillow>=10",  # 图片上传缩略图生成
    "optuna>=3.6",  # 智能调参（贝叶斯 / 多目标搜索）：Agent 的 start_tuning 依赖它
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
research = ["pandas>=2.2,<4", "scipy>=1.13,<2", "matplotlib>=3.8,<4", "networkx>=3,<4", "scikit-learn>=1.5,<2", "joblib>=1,<2"]
neural = ["torch>=2.8,<3"]
desktop = ["pywebview>=5,<7", "psutil>=5.9", "pystray>=0.19", "openpyxl>=3.1", "pyarrow>=16"]
# 本地 Agent 交付物导出（Markdown→Word / 汇报 PPT）；缺失时工具会给出可执行的安装提示
deliverables = ["python-docx>=1.1,<2", "python-pptx>=1.0,<2", "Pillow>=10,<12", "PyMuPDF>=1.24,<2"]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]
# 生产部署：PostgreSQL + Redis + Parquet（单机开发不装也能跑：SQLite + 本地唤醒 + JSON 缓存）
postgres = ["psycopg[binary]>=3.2"]
redis = ["redis>=5.0"]
parquet = ["pyarrow>=16"]
server = ["psycopg[binary]>=3.2", "redis>=5.0", "pyarrow>=16"]

[project.scripts]
qagent = "quant_agent.cli:main"
qrun = "quant_agent.qrun:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = [
    "E501",  # 长中文提示、URL 与协议原文保持单行更易读；代码排版由 ruff format 负责
    "EXE002",  # 挂载盘会把文件标成可执行，与代码无关
    "BLE001",  # Agent/工具边界有意捕获宽泛异常，避免单点失败拖垮运行
    "RUF001",  # 中文全角标点在中文文案中是正确写法
    "RUF002",
    "RUF003",
    "RUF007",  # zip 遍历相邻元素在此处更直观
    "RUF012",  # 策略模板用类属性声明参数 schema，是只读声明而非可变共享状态
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
