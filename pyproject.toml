[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-agent"
version = "2.0.0"
description = "加密货币量化交易仿真验证平台 —— AI Agent 能力层"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "cryptography>=42",
    "numpy>=1.26",  # 因子研究：面板计算与评估
    "optuna>=3.6",  # 智能调参（贝叶斯 / 多目标搜索）：Agent 的 start_tuning 依赖它
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]
# 生产部署：PostgreSQL + Redis + Parquet（单机开发不装也能跑：SQLite + 本地唤醒 + JSON 缓存）
postgres = ["psycopg[binary]>=3.2"]
redis = ["redis>=5.0"]
parquet = ["pyarrow>=16"]
server = ["psycopg[binary]>=3.2", "redis>=5.0", "pyarrow>=16"]

[project.scripts]
qagent = "quant_agent.cli:main"
qrun = "quant_agent.qrun:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = [
    "EXE002",  # 挂载盘会把文件标成可执行，与代码无关
    "BLE001",  # Agent/工具边界有意捕获宽泛异常，避免单点失败拖垮运行
    "RUF001",  # 中文全角标点在中文文案中是正确写法
    "RUF002",
    "RUF003",
    "RUF007",  # zip 遍历相邻元素在此处更直观
    "RUF012",  # 策略模板用类属性声明参数 schema，是只读声明而非可变共享状态
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]