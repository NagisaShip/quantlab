name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  # 手动触发：用于在任意分支跑一次完整 CI（含下方的视觉回归检查）。
  workflow_dispatch:
    inputs:
      visual_baseline_run_id:
        description: '包含 visual-baseline 产物的已验收运行编号'
        type: string
        required: false
      visual_update_baseline:
        description: '生成候选基准（人工检查截图后在下次运行填写本次编号）'
        type: boolean
        default: false

jobs:
  documents:
    name: 文档交付（真实页面渲染与视觉消息回传）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装排版与渲染依赖
        run: |
          printf 'deb https://archive.ubuntu.com/ubuntu noble main restricted universe multiverse\ndeb https://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse\ndeb https://security.ubuntu.com/ubuntu noble-security main restricted universe multiverse\n' > /tmp/quantlab-ubuntu.list
          apt_opts=(-o Dir::Etc::sourcelist=/tmp/quantlab-ubuntu.list -o Dir::Etc::sourceparts=- -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_opts[@]}" update
          sudo DEBIAN_FRONTEND=noninteractive apt-get "${apt_opts[@]}" install -y --no-install-recommends libreoffice-writer libreoffice-impress fonts-noto-cjk
          python -m pip install -e '.[dev,deliverables]'
      - name: 真实 Office 导出、截图与模型图片消息
        run: python -m pytest tests/test_local_agent_deliverables.py -q
  backend:
    name: 后端（lint + 测试，SQLite）
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,research,deliverables]"
          pip install -e "./packages/agent-runtime[telemetry]"
      - name: 静态检查
        run: |
          ruff check src tests scripts packages/agent-runtime/src packages/agent-runtime/tests
          ruff format --check src tests scripts packages/agent-runtime/src packages/agent-runtime/tests
      - name: API 快照与代码一致
        run: |
          python scripts/gen_api_doc.py
          git diff --exit-code -- docs/API参考.md docs/openapi.json

      # 快速失败：先跑与桌面端 / Agent / 成果固定强相关的关键子集，再跑全量。
      # 只在一份 Python 上跑，避免三份矩阵重复等待；全量 pytest 仍然覆盖所有版本。
      - name: 关键子集（Python 3.13，快速失败）
        if: matrix.python-version == '3.13'
        run: |
          pytest -q \
            tests/test_workflows_api.py \
            tests/test_artifact_pins.py \
            tests/test_local_projects.py \
            tests/test_local_agent_deliverables.py \
            tests/test_ai_tools.py

      - name: Agent Runtime 与研究室迁移回归
        if: matrix.python-version == '3.13'
        env:
          QAGENT_AGENT_RUNTIME: "1"
        run: >-
          pytest -q packages/agent-runtime/tests tests/test_lab_runtime.py tests/test_lab_runtime_api.py
          tests/test_team_runtime.py tests/test_team_structured_runtime.py tests/test_team_runtime_api.py tests/test_generic_agent_runtime.py tests/test_strategy_lab.py tests/test_factor_research.py tests/test_model_research.py

      - name: 测试
        run: pytest -q

  backend-postgres:
    name: 后端（PostgreSQL + Redis）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装依赖（锁定版本）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install -e ".[research,deliverables]"
          pip install -e "./packages/agent-runtime[telemetry]"
      - name: Agent Runtime PostgreSQL 多进程验证
        env:
          QAGENT_TEST_PG: postgresql://postgres:ci@localhost:5432/postgres
        run: pytest -q packages/agent-runtime/tests tests/test_runtime_postgres.py
      - name: 测试（每个用例独立 schema）
        env:
          QAGENT_TEST_PG: postgresql://postgres:ci@localhost:5432/postgres
        run: pytest -q

  frontend:
    name: 前端（类型检查 + 构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: TypeScript 类型检查
        run: npx tsc -b --pretty false
      - name: i18n 提取检查（missing 必须为 0）
        shell: bash
        run: |
          node scripts/i18n-extract.cjs "$RUNNER_TEMP/i18n-missing.json"
          node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/i18n-missing.json','utf8'));const n=r.plain.length+r.templates.length;if(n){console.error('缺少 i18n 文案：plain='+r.plain.length+' templates='+r.templates.length);console.error([...r.plain,...r.templates].slice(0,20).join('\n'));process.exit(1)}console.log('i18n missing 0')"
      - name: 构建（含 tsc 类型检查）
        run: npm run build
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  e2e:
    name: 端到端（Playwright · ${{ matrix.storage }}）
    runs-on: ubuntu-latest
    # 存储后端矩阵：同一套 E2E 在 SQLite 与 PostgreSQL(+Redis) 上各跑一遍。
    # 这样"起 PostgreSQL + Redis 服务"不是摆设 —— 服务真的被 E2E 链路用上，
    # 也顺带证明了业务链路在两个存储后端上行为一致。
    strategy:
      fail-fast: false
      matrix:
        storage: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      # E2E 后端与 worker 共用这个数据目录（JSON 侧：工作区 store / 结果对象）。
      # 每次运行会再套一层带运行编号的子目录，见 tests/e2e/run-env.ts。
      QAGENT_E2E_HOME: ${{ github.workspace }}/tests/e2e/.tmp/home-${{ matrix.storage }}
      # 刻意避开 8000：本机与部分 runner 上 8000 常被占用。
      QAGENT_E2E_PORT: "8199"
      PYTHONUTF8: "1"
      # postgres 腿把 SQL 侧切到 PG，并用 Redis 做 worker 唤醒；
      # sqlite 腿两个变量都留空，走默认的 SQLite + 进程内唤醒。
      QAGENT_DATABASE_URL: ${{ matrix.storage == 'postgres' && 'postgresql://postgres:ci@localhost:5432/postgres' || '' }}
      QAGENT_REDIS_URL: ${{ matrix.storage == 'postgres' && 'redis://localhost:6379/0' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装后端依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,server,research,deliverables]"

      - name: 安装前端依赖并构建（后端单端口交付 web/dist）
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: 安装 E2E 依赖（仓库根，spec 在 tests/e2e/ 下）
        run: npm ci --no-audit --no-fund

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: 研究流程页面覆盖审计
        run: npm run qa:research

      - name: Mermaid 中文兼容自检
        run: npm run qa:mermaid

      - name: E2E 类型检查（spec 语法与类型）
        run: npm run e2e:typecheck

      - name: 列出用例（收集失败即视为配置错误）
        run: npm run e2e:list

      - name: 运行端到端测试
        run: npm run e2e
        env:
          CI: "true"

      - name: Agent Runtime 研究室恢复验收
        run: npx playwright test tests/e2e/19-runtime-recovery.spec.ts tests/e2e/20-team-runtime.spec.ts --workers=1
        env:
          CI: "true"
          QAGENT_AGENT_RUNTIME: "1"
          QAGENT_AGENT_RUNTIME_DB: ${{ matrix.storage == 'postgres' && 'postgresql://postgres:ci@localhost:5432/postgres' || '' }}
          QAGENT_AGENT_RUNTIME_SCHEMA: agent_runtime_e2e

      - name: 上传 trace / 截图 / 报告（失败也上传）
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ matrix.storage }}
          path: |
            tests/e2e/.artifacts
            tests/e2e/.tmp
          retention-days: 14
          if-no-files-found: ignore

  visual:
    name: 视觉回归（手动 workflow_dispatch）
    permissions:
      contents: read
      actions: read
    # 只在手动触发时跑：需要真实浏览器与已构建的前端，避免拖慢每次 PR。
    # 本地等价命令见 docs/CI与视觉回归.md；脚本默认用系统 Chrome，CI 用 Chromium。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      QUANTLAB_BASE: http://127.0.0.1:8399
      QAGENT_HOME: ${{ github.workspace }}/.tmp/visual-home
      QAGENT_BACKGROUND: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装后端 / 前端依赖并构建
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          cd web
          npm ci --no-audit --no-fund
          npm run build
      - name: 安装 E2E 依赖与 Playwright Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 启动后端（单端口交付 web/dist）
        run: |
          mkdir -p .tmp
          nohup python -m quant_agent.cli serve --port 8399 --no-with-worker > .tmp/visual-backend.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8399/api/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "后端启动失败，日志：" >&2
          cat .tmp/visual-backend.log >&2
          exit 1
      - name: 视觉检查（pageerror / 横向溢出 / 截图）
        run: node scripts/visual_check.mjs --channel chromium
      - name: 下载已验收像素基准
        if: inputs.visual_baseline_run_id != '' && !inputs.visual_update_baseline
        uses: actions/download-artifact@v4
        with:
          name: visual-baseline
          path: .tmp/visual-baseline
          run-id: ${{ inputs.visual_baseline_run_id }}
          github-token: ${{ github.token }}
      - name: MCP 像素回归（显式生成基准或比较）
        env:
          UPDATE_BASELINE: ${{ inputs.visual_update_baseline }}
          BASELINE_RUN_ID: ${{ inputs.visual_baseline_run_id }}
        run: |
          if [ -z "$BASELINE_RUN_ID" ] && [ "$UPDATE_BASELINE" != "true" ]; then
            echo "::notice::未提供已验收基准；本次只检查 pageerror / 横向溢出，不执行像素比较。"
            exit 0
          fi
          args=(--channel chromium --pages mcp --out .tmp/visual-mcp --baseline .tmp/visual-baseline)
          if [ "$UPDATE_BASELINE" = "true" ]; then args+=(--update-baseline); fi
          node scripts/visual_check.mjs "${args[@]}"
      - name: 上传候选基准
        if: inputs.visual_update_baseline
        uses: actions/upload-artifact@v4
        with:
          name: visual-baseline
          path: .tmp/visual-baseline
          if-no-files-found: error
      - name: 上传截图与报告（失败也上传）
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: |
            .tmp/visual
            .tmp/visual-mcp
          retention-days: 14
          if-no-files-found: ignore

  compose:
    name: 部署配置校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        run: |
          mkdir -p secrets && echo placeholder > secrets/secret.key
          cp .env.example .env
          docker compose config -q
          docker compose build
